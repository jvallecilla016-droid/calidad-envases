<body><main class="login"><h1>Sin conexión</h1>
<p>El celular no tiene señal o el servidor no responde. Los datos se guardan en la base central, así que hace falta conexión para registrar.</p>
<p>Lo que estabas digitando sigue en la pantalla anterior. Cuando vuelva la señal, regresa y guarda de nuevo.</p>
<p><button class="btn primary" onclick="location.reload()">Reintentar</button></p></main></body></html>
